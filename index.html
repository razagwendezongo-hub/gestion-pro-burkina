<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14302b">
<link rel="manifest" href="manifest.json">
<title>Gestion Financière Pro</title>
<link rel="stylesheet" href="style.css">
<!-- Intégration de Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Intégration du client Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ÉCRAN D'AUTHENTIFICATION -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h2 id="authTitle" style="margin-top:0;">Connexion / Inscription</h2>
      <label for="authUser">Nom d'utilisateur</label>
      <input id="authUser" type="text" placeholder="Ex: Zongo..." autocomplete="off">
      <label for="authPass" style="margin-top:12px;">Mot de passe</label>
      <input id="authPass" type="password" placeholder="••••••••">
      <button class="go" id="authBtn">Se connecter</button>
      <button class="lnk" id="authSwitch" type="button" style="width:100%; text-align:center; margin-top:12px; border:0; background:transparent; color:var(--in); font-weight:600; cursor:pointer;">Créer un compte</button>
      <p class="msg" id="authMsg" style="text-align:center;"></p>
    </div>
  </div>

  <!-- MENU LATÉRAL -->
  <div id="sidebarOverlay" class="sidebar-overlay" style="display:none;">
    <aside class="sidebar-drawer">
      <div class="sidebar-header">
        <h3 style="margin:0;">Menu</h3>
        <button id="closeSidebar" style="background:none; border:0; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div class="sidebar-menu-items">
        <button class="side-btn" id="navTheme">🌓 Mode Sombre / Clair</button>
        <button class="side-btn" id="navExportCsv">📊 Exporter en CSV (Excel)</button>
        <button class="side-btn" id="navResetMonth">🗑️ Effacer le mois en cours</button>
        <button class="side-btn logout" id="navLogout">🚪 Déconnexion</button>
      </div>
    </aside>
  </div>

  <!-- PAGE MODALE PARAMÈTRES -->
  <div id="settingsModal" class="modal-screen" style="display:none;">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px;">
        <h3 style="margin:0;">⚙️ Paramètres</h3>
        <button id="closeSettingsModal" style="background:none; border:0; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <label>Devise de l'application</label>
      <input id="setCurrency" type="text" value="FCFA">
      <button class="go" id="saveSettingsBtn" style="background:var(--in); margin-top:16px;">Fermer</button>
    </div>
  </div>

<main id="appMain" style="display:none;">
  <!-- BARRE SUPÉRIEURE -->
  <header class="header-top">
    <div class="header-left">
      <button id="openSidebarBtn" class="menu-hamburger-btn" title="Menu">☰</button>
      <span id="userGreeting" class="user-greeting-txt">Mon Compte</span>
    </div>
    <div class="header-right-controls">
      <div class="header-date-picker">
        <button id="prevMonth" class="mini-nav-btn">‹</button>
        <h1 id="monthLabel" class="mini-month-title"></h1>
        <button id="nextMonth" class="mini-nav-btn">›</button>
      </div>
      <button id="navSettingsTop" class="settings-top-btn" title="Paramètres">⚙️</button>
    </div>
  </header>

  <!-- ================= PAGE 1 : ACCUEIL ================= -->
  <div id="pageHome" class="app-page-content">
    <section>
      <div class="solde-main-box" style="margin-bottom:0;">
        <span class="solde-title-label">Solde principal du mois</span>
        <div class="solde-big-amount" id="solde">0 FCFA</div>
      </div>
      <div class="solde-details-grid" style="margin-top:12px;">
        <div class="detail-card expense-card">
          <span class="detail-label">Dépenses</span>
          <span class="detail-amount" id="tOut">0 FCFA</span>
        </div>
        <div class="detail-card income-card">
          <span class="detail-label">Revenus</span>
          <span class="detail-amount" id="tIn">0 FCFA</span>
        </div>
      </div>
    </section>

    <!-- SAISIE RAPIDE -->
    <section>
      <h2>Nouvelle opération</h2>
      <div class="tog" role="group">
        <button id="bOut" aria-pressed="true">Dépense</button>
        <button id="bIn" aria-pressed="false">Revenu</button>
      </div>
      <div class="row2">
        <div><label for="amt">Montant</label><input id="amt" type="text" inputmode="decimal" placeholder="0"></div>
        <div><label for="accountSelectOp">Portefeuille / Compte</label><select id="accountSelectOp"></select></div>
      </div>
      <div style="margin-top:8px;">
        <label for="cat">Catégorie</label><select id="cat"></select>
      </div>
      <div class="row2" style="margin-top:8px;">
        <div><label for="note">Note</label><input id="note" type="text" maxlength="60" placeholder="Ex: Marché"></div>
        <div><label for="opDate">Date</label><input id="opDate" type="date"></div>
      </div>
      <button class="go" id="add">Enregistrer</button>
      <p class="msg" id="msg"></p>
    </section>
  </div>

  <!-- ================= PAGE 2 : COMPTES & OBJECTIFS D'ÉPARGNE ================= -->
  <div id="pageAccounts" class="app-page-content" style="display:none;">
    <section>
      <h2>💳 Comptes & Portefeuilles</h2>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input id="newAccountName" type="text" placeholder="Nouveau compte..." style="flex:1;">
        <button id="submitAddAccount" style="background:var(--in); color:#fff; border:0; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer;">Créer</button>
      </div>
      <div id="accountsListDetailed" style="display:flex; flex-direction:column; gap:8px;"></div>
    </section>

    <section>
      <h2>🎯 Objectifs d'épargne (Pots)</h2>
      <div class="row2">
        <div><label>Nom du projet</label><input id="potName" type="text" placeholder="Ex: Téléphone"></div>
        <div><label>Montant cible</label><input id="potTarget" type="text" inputmode="decimal" placeholder="0"></div>
      </div>
      <div style="margin-top:8px;"><label>Déjà épargné</label><input id="potSaved" type="text" inputmode="decimal" placeholder="0"></div>
      <button class="go" id="addPotBtn" style="background:var(--in);">Ajouter l'objectif</button>
      <div id="potsList" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;"></div>
    </section>
  </div>

  <!-- ================= PAGE 3 : HISTORIQUE & DETTES ================= -->
  <div id="pageOperations" class="app-page-content" style="display:none;">
    <section>
      <h2>Historique & Filtres</h2>
      <div class="row2" style="margin-bottom:8px;">
        <div><label>Filtrer par</label><select id="filterMode"><option value="month">Ce mois</option><option value="week">Cette semaine</option><option value="all">Tout</option></select></div>
        <div><label>Rechercher</label><input id="searchQuery" type="text" placeholder="🔍 Mot clé..." autocomplete="off"></div>
      </div>
      <ul id="list"></ul>
    </section>

    <section>
      <h2>🤝 Dettes et Prêts</h2>
      <div class="tog" role="group">
        <button id="debtOut" aria-pressed="true">Je dois</button>
        <button id="debtIn" aria-pressed="false">On me doit</button>
      </div>
      <div class="row2">
        <div><label>Nom de la personne</label><input id="debtPerson" type="text" placeholder="Nom"></div>
        <div><label>Montant</label><input id="debtAmt" type="text" inputmode="decimal" placeholder="0"></div>
      </div>
      <div style="margin-top:8px;"><label>Date d'échéance</label><input id="debtDate" type="date"></div>
      <button class="go" id="addDebtBtn" style="background:var(--out);">Enregistrer la dette</button>
      <div id="debtsList" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;"></div>
    </section>
  </div>

  <!-- ================= PAGE 4 : ANALYSES & GRAPHIQUES ================= -->
  <div id="pageAnalytics" class="app-page-content" style="display:none;">
    <section>
      <h2>📊 Répartition des dépenses</h2>
      <div style="max-width: 280px; margin: 0 auto;">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>
  </div>

  <!-- BARRE DE NAVIGATION INFÉRIEURE -->
  <nav class="bottom-nav-bar">
    <button class="bottom-nav-btn active" data-target="pageHome"><span class="nav-icon">🏠</span><span>Accueil</span></button>
    <button class="bottom-nav-btn" data-target="pageAccounts"><span class="nav-icon">💳</span><span>Comptes</span></button>
    <button class="bottom-nav-btn" data-target="pageOperations"><span class="nav-icon">💸</span><span>Opérations</span></button>
    <button class="bottom-nav-btn" data-target="pageAnalytics"><span class="nav-icon">📊</span><span>Analyses</span></button>
  </nav>
</main>

<script>
// Configuration Supabase
const SUPABASE_URL = 'https://meiluzsbvlnmcwkquoga.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2SgbI7adXfv2k07k-2x4Sw_-5vveoSo';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEFAULT_ICONS = {
  "Nourriture": "🛒", "Transport": "🚗", "Essence": "⛽", "Crédit téléphone": "📱", 
  "Internet": "🌐", "Logement": "🏠", "Électricité": "⚡", "Eau": "💧", 
  "Santé": "💊", "École": "📚", "Famille": "👨‍👩‍👧‍👦", "Vêtements": "👕", 
  "Ménage et hygiène": "🧼", "Entretien et réparations": "🔧", "Abonnements": "📺", 
  "Loisirs": "🎉", "Épargne": "💰", "Dons et aide": "🤝", "Autre": "📦",
  "Salaire": "💵", "Ventes": "📈", "Prime": "🎁", "Aide familiale": "🤲", "Cadeau": "🎁", "Autre revenu": "💼"
};

const CATS = {
  out: ["Nourriture","Transport","Essence","Crédit téléphone","Internet","Logement","Électricité","Eau","Santé","École","Famille","Vêtements","Ménage et hygiène","Entretien et réparations","Abonnements","Loisirs","Épargne","Dons et aide","Autre"],
  in: ["Salaire","Ventes","Prime","Aide familiale","Cadeau","Autre revenu"]
};

let currentUser = localStorage.getItem("current_user");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };

let S = { 
  tx: [], 
  accounts: [{ id: 'acc_main', name: 'Compte Principal', balance: 0 }, { id: 'acc_momo', name: 'Orange Money', balance: 0 }],
  pots: [], debts: [], cur: "FCFA", theme: "light" 
};

async function loadUserData() {
  if (!currentUser) return;
  try {
    const { data, error } = await supabase
      .from('profiles')
      .select('data')
      .eq('username', currentUser)
      .single();
    
    if (data && data.data) {
      S = Object.assign(S, data.data);
    }
  } catch (e) {
    console.log("Chargement local de secours");
    const local = localStorage.getItem("backup_" + currentUser);
    if (local) S = JSON.parse(local);
  }
}

async function save() {
  if (!currentUser) return;
  // Sauvegarde locale de secours
  localStorage.setItem("backup_" + currentUser, JSON.stringify(S));
  
  // Sauvegarde sur Supabase
  try {
    await supabase
      .from('profiles')
      .upsert({ username: currentUser, data: S }, { onConflict: 'username' });
  } catch (e) {
    console.error("Erreur de synchronisation Supabase", e);
  }
}

const getIcon = c => DEFAULT_ICONS[c] || "📌";
const money = n => Math.round(n).toLocaleString("fr-FR") + " " + S.cur;

let month = today().slice(0, 7), type = "out", debtType = "out";
let myChart = null;

async function checkAuth() {
  if (currentUser) {
    await loadUserData();
    $("authScreen").style.display = "none";
    $("appMain").style.display = "block";
    $("userGreeting").textContent = "Compte : " + currentUser;
    $("opDate").value = today();
    setType("out");
    render();
  } else {
    $("authScreen").style.display = "flex";
    $("appMain").style.display = "none";
  }
}

$("authSwitch").onclick = () => {
  const title = $("authTitle");
  if (title.textContent.includes("Connexion")) {
    title.textContent = "Créer un compte";
    $("authBtn").textContent = "S'inscrire";
    $("authSwitch").textContent = "Déjà un compte ? Se connecter";
  } else {
    title.textContent = "Connexion / Inscription";
    $("authBtn").textContent = "Se connecter";
    $("authSwitch").textContent = "Créer un compte";
  }
};

$("authBtn").onclick = async () => {
  const u = $("authUser").value.trim();
  const p = $("authPass").value;
  if (!u || !p) { alert("Veuillez remplir tous les champs."); return; }
  currentUser = u;
  localStorage.setItem("current_user", u);
  await checkAuth();
};

document.querySelectorAll(".bottom-nav-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".bottom-nav-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".app-page-content").forEach(p => p.style.display = "none");
    btn.classList.add("active");
    $(btn.getAttribute("data-target")).style.display = "block";
    if(btn.getAttribute("data-target") === "pageAnalytics") renderChart();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});

$("openSidebarBtn").onclick = () => { $("sidebarOverlay").style.display = "flex"; };
$("closeSidebar").onclick = () => { $("sidebarOverlay").style.display = "none"; };
$("sidebarOverlay").onclick = (e) => { if (e.target === $("sidebarOverlay")) $("sidebarOverlay").style.display = "none"; };
$("navSettingsTop").onclick = () => { $("settingsModal").style.display = "flex"; };
$("closeSettingsModal").onclick = () => { $("settingsModal").style.display = "none"; };
$("saveSettingsBtn").onclick = () => { $("settingsModal").style.display = "none"; };

$("navTheme").onclick = () => {
  S.theme = S.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", S.theme);
  save();
  $("sidebarOverlay").style.display = "none";
};
if (S.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");

$("navLogout").onclick = () => { localStorage.removeItem("current_user"); currentUser = null; location.reload(); };

$("navExportCsv").onclick = () => {
  let csv = "Date,Type,Categorie,Montant,Note\n";
  S.tx.forEach(t => { csv += `${t.date},${t.type},${t.cat},${t.amt},"${t.note || ''}"\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `export_finances_${currentUser}.csv`;
  a.click();
  $("sidebarOverlay").style.display = "none";
};

$("navResetMonth").onclick = () => {
  if (confirm("Effacer les opérations de ce mois ?")) {
    S.tx = S.tx.filter(t => !t.date.startsWith(month));
    save(); render();
    $("sidebarOverlay").style.display = "none";
  }
};

$("submitAddAccount").onclick = () => {
  const name = $("newAccountName").value.trim();
  if (!name) return;
  S.accounts.push({ id: 'acc_' + Date.now(), name, balance: 0 });
  save(); $("newAccountName").value = ""; render();
};

$("addPotBtn").onclick = () => {
  const name = $("potName").value.trim();
  const target = parseFloat($("potTarget").value);
  const saved = parseFloat($("potSaved").value) || 0;
  if (name && target > 0) {
    S.pots.push({ id: Date.now(), name, target, saved });
    save();
    $("potName").value = ""; $("potTarget").value = ""; $("potSaved").value = "";
    render();
  }
};

$("debtOut").onclick = () => { debtType = "out"; $("debtOut").setAttribute("aria-pressed", "true"); $("debtIn").setAttribute("aria-pressed", "false"); };
$("debtIn").onclick = () => { debtType = "in"; $("debtIn").setAttribute("aria-pressed", "true"); $("debtOut").setAttribute("aria-pressed", "false"); };

$("addDebtBtn").onclick = () => {
  const person = $("debtPerson").value.trim();
  const amt = parseFloat($("debtAmt").value);
  const due = $("debtDate").value;
  if (person && amt > 0) {
    S.debts.push({ id: Date.now(), type: debtType, person, amt, due });
    save();
    $("debtPerson").value = ""; $("debtAmt").value = ""; $("debtDate").value = "";
    render();
  }
};

function setType(t) {
  type = t;
  $("bOut").setAttribute("aria-pressed", t === "out");
  $("bIn").setAttribute("aria-pressed", t === "in");
  $("cat").replaceChildren(...[...S.cats[t], ...CATS[t]].map(c => new Option(getIcon(c) + " " + c, c)));
}
$("bOut").onclick = () => setType("out");
$("bIn").onclick = () => setType("in");

function renderAccountsList() {
  const box = $("accountsListDetailed");
  const selectOp = $("accountSelectOp");
  if (!box || !selectOp) return;
  box.replaceChildren(); selectOp.replaceChildren();

  S.accounts.forEach(acc => {
    const accTx = S.tx.filter(t => t.accountId === acc.id);
    const balance = accTx.reduce((sum, t) => t.type === 'in' ? sum + t.amt : sum - t.amt, acc.balance);

    const div = document.createElement("div");
    div.style.cssText = "background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center;";
    div.innerHTML = `<b>💳 ${acc.name}</b><span style="font-weight:700;">${money(balance)}</span>`;
    box.append(div);
    selectOp.append(new Option(acc.name, acc.id));
  });
}

function render() {
  $("monthLabel").textContent = month;
  renderAccountsList();

  const mode = $("filterMode").value;
  let filtered = S.tx;
  if (mode === "month") filtered = S.tx.filter(t => t.date.startsWith(month));
  else if (mode === "week") {
    const now = new Date();
    const oneWeekAgo = new Date(now.setDate(now.getDate() - 7));
    filtered = S.tx.filter(t => new Date(t.date) >= oneWeekAgo);
  }

  const monthTx = S.tx.filter(t => t.date.startsWith(month));
  const sum = k => monthTx.filter(t => t.type === k).reduce((s, t) => s + t.amt, 0);
  const o = sum("out"), i = sum("in");
  $("tOut").textContent = money(o);
  $("tIn").textContent = money(i);
  $("solde").textContent = money(i - o);

  const query = $("searchQuery").value.toLowerCase();
  const listFiltered = filtered.filter(t => t.cat.toLowerCase().includes(query) || (t.note && t.note.toLowerCase().includes(query)));
  
  const ul = $("list");
  ul.replaceChildren();
  if (!listFiltered.length) {
    ul.innerHTML = '<li style="text-align:center; color:var(--mute); padding:15px; display:block;">Aucune opération.</li>';
  } else {
    listFiltered.forEach(t => {
      const li = document.createElement("li");
      li.innerHTML = `<div class="m"><b>${getIcon(t.cat)} ${t.cat}</b><small>${t.date}${t.note ? ' · ' + t.note : ''}</small></div><div class="a ${t.type}">${t.type === 'out' ? '−' : '+'}${money(t.amt)}</div>`;
      ul.append(li);
    });
  }

  const potsBox = $("potsList");
  potsBox.replaceChildren();
  S.pots.forEach(p => {
    const pct = Math.min(100, Math.round((p.saved / p.target) * 100));
    const div = document.createElement("div");
    div.style.cssText = "background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px;";
    div.innerHTML = `<b>🎯 ${p.name}</b> : ${money(p.saved)} / ${money(p.target)} (${pct}%)<div style="background:var(--line); border-radius:5px; height:8px; margin-top:6px; overflow:hidden;"><div style="background:var(--in); width:${pct}%; height:100%;"></div></div>`;
    potsBox.append(div);
  });

  const debtsBox = $("debtsList");
  debtsBox.replaceChildren();
  S.debts.forEach(d => {
    const div = document.createElement("div");
    div.style.cssText = "background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center;";
    div.innerHTML = `<span><b>${d.person}</b> (${d.type === 'out' ? 'Je dois' : 'On me doit'})<br><small style="color:var(--mute);">${d.due || 'Sans date'}</small></span><span style="font-weight:700; color:${d.type==='out'?'var(--out)':'var(--in)'};">${money(d.amt)}</span>`;
    debtsBox.append(div);
  });
}

function renderChart() {
  const ctx = $("expenseChart").getContext('2d');
  const monthTx = S.tx.filter(t => t.date.startsWith(month) && t.type === 'out');
  const catTotals = {};
  monthTx.forEach(t => { catTotals[t.cat] = (catTotals[t.cat] || 0) + t.amt; });

  if (myChart) myChart.destroy();
  myChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: Object.keys(catTotals),
      datasets: [{ data: Object.values(catTotals), backgroundColor: ['#c2412d','#23805a','#3b82f6','#eab308','#a855f7','#ec4899','#14302b'] }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } }
  });
}

$("searchQuery").oninput = render;
$("filterMode").onchange = render;

$("add").onclick = () => {
  let amt = parseFloat($("amt").value.replace(/\s/g, "").replace(",", "."));
  if (!(amt > 0)) { alert("Entrez un montant valide."); return; }
  S.tx.ptr = S.tx.push({ id: Date.now(), type, amt, cat: $("cat").value, note: $("note").value.trim(), date: $("opDate").value \vert{}\vert{} today(), accountId: $("accountSelectOp").value });
  save();
  $("amt").value = ""; $("note").value = "";
  render();
  alert("Opération enregistrée !");
};

checkAuth();
</script>
</body>
</html>
